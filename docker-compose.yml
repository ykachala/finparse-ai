version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    command: python -m src
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finparse:finparse@postgres:5432/finparse
      SYNC_DATABASE_URL: postgresql://finparse:finparse@postgres:5432/finparse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: celery -A src.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finparse:finparse@postgres:5432/finparse
      SYNC_DATABASE_URL: postgresql://finparse:finparse@postgres:5432/finparse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finparse
      POSTGRES_PASSWORD: finparse
      POSTGRES_DB: finparse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finparse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
